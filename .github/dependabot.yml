version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      # Follows the Node runtime line instead of the latest published types.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      routine-site-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Majors arrive as one PR per week and stay held for review. The
      # auto-merge exception is only a head ref segment of github_actions,
      # so this group is never armed.
      site-major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
      site-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      routine-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Armed when the head ref segment is github_actions and the title or
      # body shows a major version pair. Required checks still have to pass;
      # nothing here bypasses branch protection.
      actions-major-updates:
        patterns:
          - "*"
        update-types:
          - major
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      routine-python-tools:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Stays held for review. The GitHub Actions exception does not apply.
      python-major-updates:
        patterns:
          - "*"
        update-types:
          - major
    commit-message:
      prefix: deps
