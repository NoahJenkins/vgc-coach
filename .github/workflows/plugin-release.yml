name: Plugin Release

on:
  # A VERSION bump arrives through a human-merged pull request, so the push
  # event fires (unlike merges done by auto-merge with GITHUB_TOKEN). Manual
  # dispatch stays as a fallback.
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify release branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Release workflow must run from main. Current ref: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python3 -m pip install -r tools/requirements-autoresearch.txt

      - name: Run packaging checks
        # Generated plugin files are already enforced by plugin-package-check
        # before merge, so this job only validates and tags. (It used to
        # regenerate and `git push origin HEAD:main`; that step never had
        # anything to commit and branch protection would have rejected it.)
        run: |
          set -euo pipefail
          python3 tools/validate.py --scope core

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          TAG="v${VERSION}"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; nothing to release."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "$(python3 tools/build_plugins.py print-release-notes)"
