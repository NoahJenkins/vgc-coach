name: Plugin Release

on:
  # Plugin releases start by hand (AGENTS.md); agents auto-merge in this repo,
  # so a push trigger would let any merged VERSION bump publish a release.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Release workflow must run from main. Current ref: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python3 -m pip install -r tools/requirements-autoresearch.txt

      - name: Run packaging checks
        # Generated plugin files are already enforced by plugin-package-check
        # before merge, so this job only validates and tags. (It used to
        # regenerate and `git push origin HEAD:main`; that step never had
        # anything to commit and branch protection would have rejected it.)
        run: |
          set -euo pipefail
          python3 tools/validate.py --scope core

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to release."
            exit 0
          fi
          # A tag without a release means an earlier run pushed the tag and then
          # failed; finish that release instead of treating the tag as done.
          git fetch --tags
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$(python3 tools/build_plugins.py print-release-notes)"
