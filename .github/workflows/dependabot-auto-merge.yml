name: Dependabot Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: enable-auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check changed files stay within dependency manifests
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Every commit must come from Dependabot; a maintainer commit pushed onto
          # the branch needs normal review instead of riding the dependency merge.
          mapfile -t commit_authors < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --jq '.[] | .author.login // "unknown"')
          if [ "${#commit_authors[@]}" -eq 0 ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for author in "${commit_authors[@]}"; do
            if [ "$author" != "dependabot[bot]" ]; then
              echo "Skipping auto-merge because a commit is authored by $author"
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          mapfile -t changed_files < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for path in "${changed_files[@]}"; do
            case "$path" in
              site/*|.github/workflows/*|tools/requirements-autoresearch.txt)
                ;;
              *)
                echo "Skipping auto-merge because $path is not a dependency manifest or workflow"
                echo "eligible=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done

          echo "eligible=true" >> "$GITHUB_OUTPUT"

      # Majors are never armed: required review-gate fails them, so an armed
      # major would sit open forever. Grouped majors are recognised by their
      # group name in the branch (see dependabot.yml); any other PR by a
      # "from X to Y" with a different major in its title or body (grouped
      # security PRs list each member as "Updates `pkg` from X to Y" or a table row).
      - name: Skip major updates
        id: update_type
        if: steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          major=false
          case "$HEAD_REF" in
            *major-updates*) major=true ;;
          esac
          # "from 1.2.3 to 2.0.0" (or "from 4 to 5" for action tags) in prose,
          # "| `1.2.3` | `2.0.0` |" in group tables; only the majors are compared.
          pairs="$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | grep -oE 'from `?v?[0-9]+[^ `]*`? to `?v?[0-9]+|\| `v?[0-9]+[^`]*` \| `v?[0-9]+' || true)"
          while IFS= read -r pair; do
            [ -n "$pair" ] || continue
            if [[ "$pair" =~ ^(from|\|)\ \`?v?([0-9]+)[^\ ]*\ (to|\|)\ \`?v?([0-9]+)$ ]] \
              && [ "${BASH_REMATCH[2]}" != "${BASH_REMATCH[4]}" ]; then
              major=true
            fi
          done <<<"$pairs"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          if [ "$major" = "true" ]; then
            echo "Not arming auto-merge: major version update."
            gh label create dependency-major --repo "$GITHUB_REPOSITORY" --color FBCA04 \
              --description "Major dependency update; needs a human" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label dependency-major
          fi

      - name: Enable auto-merge
        if: steps.scope.outputs.eligible == 'true' && steps.update_type.outputs.major != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

      # Auto-merge enabled on an earlier push stays armed unless it is revoked
      # when a later push takes the pull request out of scope.
      - name: Disable auto-merge
        if: steps.scope.outputs.eligible != 'true' || steps.update_type.outputs.major == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          armed="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$armed" = "true" ]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi
