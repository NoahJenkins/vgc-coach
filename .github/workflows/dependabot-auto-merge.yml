name: Dependabot Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: enable-auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check changed files stay within dependency manifests
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Every commit must come from Dependabot; a maintainer commit pushed onto
          # the branch needs normal review instead of riding the dependency merge.
          mapfile -t commit_authors < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --jq '.[] | .author.login // "unknown"')
          if [ "${#commit_authors[@]}" -eq 0 ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for author in "${commit_authors[@]}"; do
            if [ "$author" != "dependabot[bot]" ]; then
              echo "Skipping auto-merge because a commit is authored by $author"
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          mapfile -t changed_files < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for path in "${changed_files[@]}"; do
            case "$path" in
              site/*|.github/workflows/*|tools/requirements-autoresearch.txt)
                ;;
              *)
                echo "Skipping auto-merge because $path is not a dependency manifest or workflow"
                echo "eligible=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done

          echo "eligible=true" >> "$GITHUB_OUTPUT"

      # Grouped majors are recognised by their group name in the branch (see
      # dependabot.yml); any other PR by a "from X to Y" with a different major
      # in its title or body (grouped security PRs list each member as
      # "Updates `pkg` from X to Y" or a table row). The ecosystem is that
      # same head ref's Dependabot segment (github_actions, not the
      # dependabot.yml key github-actions). No third-party action: the Actions
      # allowlist does not permit dependabot/*, and a disallowed uses: fails
      # job setup for every Dependabot pull request.
      - name: Detect major updates
        id: major
        if: steps.scope.outputs.eligible == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # BEGIN dependabot-update-signals
          # Prints major, ecosystem, and update_type. update_type is
          # version-update:semver-major when a from-X-to-Y pair changes the
          # major, and empty when that evidence is missing. A major-updates
          # branch with no such pair stays major with an empty update type.
          dependabot_update_signals() {
            local head_ref="$1"
            local title="$2"
            local body="$3"
            local major=false
            local ecosystem=""
            local update_type=""
            local pairs pair
            case "$head_ref" in
              *major-updates*) major=true ;;
            esac
            if [[ "$head_ref" =~ ^dependabot/([A-Za-z0-9_-]+)/[^/].* ]]; then
              ecosystem="${BASH_REMATCH[1]}"
            fi
            # "from 1.2.3 to 2.0.0" (or "from 4 to 5" for action tags) in prose,
            # "| `1.2.3` | `2.0.0` |" in group tables; only the majors are compared.
            pairs="$(printf '%s\n%s\n' "$title" "$body" \
              | grep -oE 'from `?v?[0-9]+[^ `]*`? to `?v?[0-9]+|\| `v?[0-9]+[^`]*` \| `v?[0-9]+' || true)"
            while IFS= read -r pair; do
              [ -n "$pair" ] || continue
              if [[ "$pair" =~ ^(from|\|)\ \`?v?([0-9]+)[^\ ]*\ (to|\|)\ \`?v?([0-9]+)$ ]] \
                && [ "${BASH_REMATCH[2]}" != "${BASH_REMATCH[4]}" ]; then
                major=true
                update_type="version-update:semver-major"
              fi
            done <<<"$pairs"
            printf '%s\n' "$major" "$ecosystem" "$update_type"
          }
          # END dependabot-update-signals
          mapfile -t signals < <(dependabot_update_signals "$HEAD_REF" "$PR_TITLE" "$PR_BODY")
          echo "major=${signals[0]}" >> "$GITHUB_OUTPUT"
          echo "ecosystem=${signals[1]}" >> "$GITHUB_OUTPUT"
          echo "update_type=${signals[2]}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to arm auto-merge
        id: update_type
        if: steps.scope.outputs.eligible == 'true' && steps.major.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAJOR: ${{ steps.major.outputs.major }}
          PACKAGE_ECOSYSTEM: ${{ steps.major.outputs.ecosystem }}
          UPDATE_TYPE: ${{ steps.major.outputs.update_type }}
        run: |
          set -euo pipefail
          # BEGIN dependabot-merge-decision
          # major is the branch/title/body heuristic. ecosystem is the
          # Dependabot head-ref segment. update_type is the from-X-to-Y major
          # result, or empty when that evidence is missing. Prints "merge" or "hold".
          dependabot_merge_decision() {
            local major="$1"
            local ecosystem="$2"
            local update_type="$3"
            if [ "$major" != "true" ]; then
              printf '%s\n' merge
              return 0
            fi
            if [ "$ecosystem" = "github_actions" ]; then
              case "$update_type" in
                version-update:semver-major|version-update:semver-minor|version-update:semver-patch)
                  printf '%s\n' merge
                  return 0
                  ;;
              esac
            fi
            printf '%s\n' hold
          }
          # END dependabot-merge-decision
          decision="$(dependabot_merge_decision "$MAJOR" "$PACKAGE_ECOSYSTEM" "$UPDATE_TYPE")"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          if [ "$decision" = "hold" ]; then
            echo "Not arming auto-merge: major update held (ecosystem=${PACKAGE_ECOSYSTEM:-unset}, update-type=${UPDATE_TYPE:-unset})."
            gh label create dependency-major --repo "$GITHUB_REPOSITORY" --color FBCA04 \
              --description "Major dependency update; needs a human" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label dependency-major
          elif [ "$MAJOR" = "true" ]; then
            echo "Arming auto-merge for GitHub Actions ${UPDATE_TYPE}. Required checks still gate the merge."
            has_label="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "dependency-major")')"
            if [ "$has_label" = "true" ]; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label dependency-major
            fi
          fi

      - name: Enable auto-merge
        if: steps.scope.outputs.eligible == 'true' && steps.update_type.outputs.decision == 'merge'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

      # Auto-merge enabled on an earlier push stays armed unless it is revoked
      # when a later push takes the pull request out of scope or turns it into
      # a held major.
      - name: Disable auto-merge
        if: always() && steps.scope.outcome == 'success' && (steps.scope.outputs.eligible != 'true' || steps.update_type.outputs.decision == 'hold')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          armed="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$armed" = "true" ]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi
