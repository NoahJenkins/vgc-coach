name: Plugin Package CI

on:
  pull_request:
    # ready_for_review lets a maintainer start checks on bot-opened draft PRs.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: plugin-package-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugin-package-check:
    name: plugin-package-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so the freshness check can diff against the base commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python3 -m pip install -r tools/requirements-autoresearch.txt

      - name: Run core validation
        run: python3 tools/validate.py --scope core
        env:
          # Scopes the time-based freshness failure to changes that touch format
          # artifacts. An empty or unreachable base falls back to strict. A
          # pull_request checkout is the test merge commit, so its first parent is
          # exactly the base the PR is tested against.
          FORMAT_FRESHNESS_BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
