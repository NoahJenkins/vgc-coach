name: Site CI

on:
  pull_request:
    # ready_for_review lets a maintainer start checks on bot-opened draft PRs.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-build:
    name: site-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Install validation dependencies
        run: python3 -m pip install -r tools/requirements-autoresearch.txt

      - name: Build site
        run: python3 tools/validate.py --scope site
